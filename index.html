const menuCell=(a,i)=>{const cur=gm(a);return `<details><summary>Atur menu (<span class="mc">${new Set(['dashboard',...cur]).size}</span>/${GM_OPT.length+1})</summary><div style="margin-top:6px"><label style="display:flex;gap:6px;font-size:13px"><input type="checkbox" checked disabled>Dashboard</label>${GM_OPT.map(m=>`<label style="display:flex;gap:6px;font-size:13px;white-space:nowrap"><input type="checkbox" ${cur.includes(m[0])?'checked':''} onchange="togMenu(${i},'${m[0]}',this.checked,this)">${m[1]}</label>`).join('')}<button class="b s sm" style="margin-top:6px" onclick="menuAll(${i})">Terapkan ke semua guru</button></div></details>`};
function togMenu(i,k,on,el){const a=db.akun[i];if(!a)return;const t=new Set(gm(a));t.add('dashboard');on?t.add(k):t.delete(k);a.menu=MENU.map(m=>m[0]).filter(x=>t.has(x)).join(',');save();const c=el.closest('details').querySelector('.mc');if(c)c.textContent=t.size;toast('Menu akun '+a.user+' disimpan')}
function menuAll(i){const a=db.akun[i];if(!a)return;const m=a.menu||GURU_MENU.join(',');ask('Samakan menu semua akun guru dengan akun "'+a.user+'"?',()=>{db.akun.forEach(x=>{if(String(x.peran).toLowerCase()=='guru')x.menu=m});save();go('akun');toast('Menu semua akun guru disamakan')},'Ya, samakan')}
function clrRw(){ask('Kosongkan seluruh riwayat login?',()=>{db.riwayat=[];save();go('akun')})}
(function(){const hd=$('header');if(!hd)return;const set=()=>document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px');try{new ResizeObserver(set).observe(hd)}catch(e){addEventListener('resize',set)}set();addEventListener('scroll',()=>{const y=scrollY;if(y>90)hd.classList.add('cp');else if(y<12)hd.classList.remove('cp')},{passive:true})})();
boot();
</script></body></html>
